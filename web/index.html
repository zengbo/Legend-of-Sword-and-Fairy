<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rustpal — 仙劍奇俠傳</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #ccc;
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: min(96vw, calc(96vh * 1.6), 960px);
    aspect-ratio: 16 / 10;
    image-rendering: pixelated;
    background: #000;
    outline: none;
  }
  #status { margin-top: 12px; }
  #filterbar { color: #777; font-size: 12px; margin-top: 6px; }
  #filterbar select {
    background: #222;
    color: #ccc;
    border: 1px solid #444;
    border-radius: 4px;
    font: inherit;
    padding: 1px 4px;
  }
  #sound { color: #c9a45c; font-size: 13px; margin-top: 6px; }
  #keys { color: #777; font-size: 12px; }
  #about { color: #777; font-size: 12px; margin-top: 8px; }
  #about a { color: #9bb8d3; text-decoration: none; }
  #about a:hover { text-decoration: underline; }
  #copyright { color: #555; font-size: 11px; margin-top: 4px; }
  #copyright a { color: #7a94ab; text-decoration: none; }
  #copyright a:hover { text-decoration: underline; }
  #authbar {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    right: max(8px, env(safe-area-inset-right));
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 20;
    font-size: 12px;
    color: #999;
  }
  #authbar .auth-status { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auth-btn {
    background: #222;
    color: #ccc;
    border: 1px solid #444;
    border-radius: 4px;
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .auth-btn:hover { background: #2a2a2a; color: #fff; }
  .auth-btn:disabled { opacity: 0.5; cursor: default; }
  .auth-btn-primary { background: #2a3a4a; border-color: #4a6a8a; color: #cde; }
  .auth-btn-primary:hover { background: #34506a; }
  .auth-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .auth-modal {
    background: #1a1a1a;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 20px 22px;
    width: min(92vw, 340px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .auth-modal h2 {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 600;
    color: #eee;
  }
  .auth-modal input {
    background: #111;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    font: inherit;
    padding: 8px 10px;
  }
  .auth-modal input:focus { outline: 1px solid #5a7a9a; border-color: #5a7a9a; }
  .auth-actions { display: flex; gap: 8px; margin-top: 4px; }
  .auth-actions .auth-btn { flex: 1; padding: 8px 10px; }
  .auth-error { color: #e08080; font-size: 12px; min-height: 1.2em; }
  .auth-link {
    background: none;
    border: none;
    color: #8ab;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    text-align: left;
  }
  .auth-link:hover { text-decoration: underline; color: #abd; }
  .auth-hint { margin: 0; color: #666; font-size: 11px; line-height: 1.4; }

  /* Virtual gamepad, shown only on touch devices. */
  #touch { display: none; }
  #touch button {
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #bbb;
    font: 14px/1 inherit;
    padding: 0;
  }
  #touch button:active { background: rgba(255, 255, 255, 0.25); }
  #dpad {
    position: fixed;
    left: max(3vw, env(safe-area-inset-left));
    bottom: max(3vh, env(safe-area-inset-bottom));
    display: grid;
    grid-template: repeat(3, 54px) / repeat(3, 54px);
    gap: 2px;
  }
  #dpad button { border-radius: 10px; font-size: 18px; }
  #t-up { grid-area: 1 / 2; }
  #t-left { grid-area: 2 / 1; }
  #t-right { grid-area: 2 / 3; }
  #t-down { grid-area: 3 / 2; }
  #tbtns {
    position: fixed;
    right: max(3vw, env(safe-area-inset-right));
    bottom: max(3vh, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }
  #tbtns button { border-radius: 50%; }
  #t-repeat { width: 48px; height: 48px; }
  #t-cancel { width: 56px; height: 56px; }
  #t-ok { width: 72px; height: 72px; font-size: 16px; }
  @media (hover: none) and (pointer: coarse) {
    #keys { display: none; }
    #touch { display: block; }
    body { justify-content: flex-start; padding-top: 2vh; }
  }
</style>
</head>
<body>
<div id="authbar"></div>
<canvas id="screen" width="320" height="200"></canvas>
<div id="status">loading…</div>
<div id="sound" hidden>🔇 點擊畫面開啟聲音 / tap to enable sound</div>
<div id="filterbar"><label for="filter">畫質增強:</label>
  <select id="filter">
    <option value="nn">AI 高清（Real-ESRGAN）</option>
    <option value="xbr">平滑（xBR）</option>
    <option value="anime4k">動漫（Anime4K）</option>
    <option value="off">原始像素</option>
  </select>
</div>
<div id="keys">方向鍵 移動 · 空格/回車 確認 · Esc 菜單 · 戰鬥: R 連擊 A 自動 D 防禦 E 物品 W 投擲 Q 逃跑 F 仙術 S 狀態</div>
<div id="about">《仙劍奇俠傳 DOS 版》遊戲引擎的完整 Rust 移植（自 SDLPAL），以 wasm 直接在瀏覽器中運行原版遊戲數據 ·
  <a href="https://github.com/madeye/Legend-of-Sword-and-Fairy" target="_blank" rel="noopener">GitHub 倉庫</a></div>
<div id="copyright">《仙劍奇俠傳》版權歸大宇資訊股份有限公司所有，本頁面僅供技術研究與懷舊交流，禁止商業用途 ·
  引擎自 <a href="https://github.com/sdlpal/sdlpal" target="_blank" rel="noopener">SDLPAL</a> 移植（GPL-3.0）</div>
<div id="touch">
  <div id="dpad">
    <button data-key="ArrowUp" id="t-up">▲</button>
    <button data-key="ArrowLeft" id="t-left">◀</button>
    <button data-key="ArrowRight" id="t-right">▶</button>
    <button data-key="ArrowDown" id="t-down">▼</button>
  </div>
  <div id="tbtns">
    <button data-key="KeyR" id="t-repeat">連擊</button>
    <button data-key="Escape" id="t-cancel">取消</button>
    <button data-key="Enter" id="t-ok">確認</button>
  </div>
</div>
<!-- Injects COOP/COEP headers via a service worker on hosts that can't set
     response headers (e.g. GitHub Pages); no-op when already isolated. -->
<script src="coi-serviceworker.js"></script>
<script src="nn-upscale.js"></script>
<script src="upscale.js"></script>
<script src="save-store.js"></script>
<script src="auth-ui.js"></script>
<script src="main.js"></script>
</body>
</html>
