[package]
name = "rustpal"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["gui", "console"]
# Desktop window (winit + pixels + cpal). Needs system packages on Linux
# (pkg-config, libasound, X11/Wayland, …).
gui = ["dep:winit", "dep:pixels", "dep:cpal", "dep:pollster", "dep:png"]
# Pure terminal backend: no window, no sound device. Builds with only crates.io
# deps (see --no-default-features --features console). `png` is pure Rust and
# only needed for the optional HTTP UI driver (`--ui-driver`).
console = ["dep:base64", "dep:miniz_oxide", "dep:libc", "dep:png"]

[dependencies]
web-time = "1"

# GUI stack (native window). Optional so console-only builds skip system libs.
winit = { version = "0.30", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pixels = { version = "0.17.2", optional = true }
cpal = { version = "0.15", optional = true }
png = { version = "0.18", optional = true }
pollster = { version = "0.4", optional = true }
# Console video: Kitty graphics protocol (+ ANSI fallback). Pure Rust crates + libc for termios.
base64 = { version = "0.22", optional = true }
miniz_oxide = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "console"] }

[profile.release]
opt-level = 3
